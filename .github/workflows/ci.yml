name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --python 3.11 --with-requirements requirements-dev.txt pytest -q
      - name: Ruff
        run: uv run --python 3.11 --with-requirements requirements-dev.txt ruff check .
      - name: Mypy
        run: uv run --python 3.11 --with-requirements requirements-dev.txt mypy src webapp
